name: "Builds for Linux"
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # with/without openssl source
        ssl: [true, false]
        include:
          - ssl: true
            ssl_name: "with-openssl-src"
            quic: true
          - ssl: false
            ssl_name: "without-openssl-src"
            quic: false
    name: Build ${{ matrix.ssl_name }}
    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install doxygen

      - name: Install openssl3.4
        if: matrix.ssl
        run: |
          pwd
          mkdir -p openssl_root
          wget https://github.com/openssl/openssl/releases/download/openssl-3.4.1/openssl-3.4.1.tar.gz &&
            tar zxvf openssl-3.4.1.tar.gz --strip-components=1 -C openssl_root
          cd openssl_root
          ./Configure && make -j `nproc`

      - name: Build
        run: |
          rm -rf build.paho
          mkdir build.paho
          cd build.paho
          echo "pwd $PWD"
          cmake -DPAHO_BUILD_STATIC=FALSE \
                -DPAHO_BUILD_SHARED=TRUE \
                -DCMAKE_BUILD_TYPE=Debug \
                -DPAHO_WITH_SSL=TRUE \
                ${{ matrix.ssl && '-DOPENSSL_ROOT_DIR=../openssl_root' || '' }} \
                -DPAHO_BUILD_DOCUMENTATION=FALSE \
                -DPAHO_BUILD_SAMPLES=TRUE \
                -DPAHO_HIGH_PERFORMANCE=TRUE \
                -DPAHO_WITH_QUIC=${{ matrix.quic }} \
                -DMQTT_QUIC_HOSTNAME=127.0.0.1 ..
          cmake --build .

      - name: Start test broker
        run: |
          git clone https://github.com/eclipse/paho.mqtt.testing.git
          cd paho.mqtt.testing/interoperability
          python3 startbroker.py -c localhost_testing.conf &

      - name: Start test broker for Quic
        if: matrix.quic
        run: |
          sh test/ssl/emqx/etc/certs/gen.sh
          docker rm -f emqx || true
          # Hostname and EMQX_NODE_NAME must match. Do not set node.name in
          # test/emqx.conf — a mismatch (emqx@127.0.0.1 vs container id)
          # makes the official image exit with nodistribution.
          docker run -d --name emqx --hostname emqx \
          -e EMQX_NODE_NAME=emqx@emqx \
          -e EMQX_NODE__COOKIE=emqxsecretcookie \
          -e EMQX_NODE__DATA_DIR=data \
          -v `pwd`/test/ssl/emqx/etc/certs:/opt/emqx/etc/certs \
          -v `pwd`/test/emqx.conf:/opt/emqx/etc/emqx.conf \
          -p 8883:8883 -p 14567:14567/udp -p 18883:18883/udp -p 18884:18884/udp -p 18885:18885/udp -p 18886:18886/udp -p 18887:18887/udp \
          emqx/emqx:5.8.4
          ready=0
          for i in $(seq 1 45); do
            if docker exec emqx emqx ctl status; then
              echo "EMQX is ready"
              ready=1
              break
            fi
            running=$(docker inspect -f '{{.State.Running}}' emqx 2>/dev/null || echo false)
            if [ "$running" != "true" ]; then
              echo "EMQX container exited before becoming ready"
              docker logs emqx || true
              docker inspect emqx || true
              exit 1
            fi
            echo "Waiting for EMQX... ($i)"
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "EMQX did not become ready"
            docker logs emqx || true
            exit 1
          fi
          docker exec emqx emqx ctl listeners || true

      - name: Start test proxy
        run: |
          python3 test/mqttsas.py &

      - name: run tests
        run: |
          cd build.paho
          ctest -VV --timeout 600

      - name: clean up
        if: always()
        run: |
          killall python3 || true
          docker rm -f emqx || true
          sleep 3 # allow broker time to terminate and report

      - name: package
        run: |
          cd build.paho
          cpack --verbose
