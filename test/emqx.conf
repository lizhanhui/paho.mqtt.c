# Overlay for the EMQX 5.8 CI QUIC test rig.
#
# This file replaces /opt/emqx/etc/emqx.conf, so node.cookie and
# node.data_dir are required (the image entrypoint reads them via
# hocon). Do not set node.name: the workflow sets EMQX_NODE_NAME
# to emqx@127.0.0.1 so `emqx ctl` can ping a single-node broker.
# A hostname-based name (emqx@emqx) starts listeners but ctl never
# gets a pong; a conf-vs-entrypoint mismatch exits with nodistribution.
#
# Certificate paths are absolute so they resolve regardless of cwd.

node {
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

listeners.tcp.default {
  enabled = false
}

listeners.wss.default {
  enabled = false
}

# Sample / default MQTT-over-QUIC listener
listeners.quic.default {
  enabled = true
  bind = "14567"
  max_connections = infinity
  peer_bidi_stream_count = 1024
  ssl_options {
    keyfile = "/opt/emqx/etc/certs/key.pem"
    certfile = "/opt/emqx/etc/certs/cert.pem"
    cacertfile = "/opt/emqx/etc/certs/cacert.pem"
  }
}

# Mutual authentication (test2a / test2e) — start_port+1 = 18884
# fail_if_no_peer_cert is planned-only for QUIC in EMQX 5.8, so test2d
# (no client cert) relies on MQTTAsync connectTimeout instead of a
# handshake reject (see test5.c test2d).
listeners.quic.mtls {
  enabled = true
  bind = "18884"
  max_connections = infinity
  peer_bidi_stream_count = 1024
  ssl_options {
    verify = verify_peer
    keyfile = "/opt/emqx/etc/certs/key.pem"
    certfile = "/opt/emqx/etc/certs/cert.pem"
    cacertfile = "/opt/emqx/etc/certs/cacert.pem"
  }
}

# Server authentication, no client cert required (test3a / test4 / test6 / test7)
# start_port+2 = 18885
listeners.quic.verify_server {
  enabled = true
  bind = "18885"
  max_connections = infinity
  peer_bidi_stream_count = 1024
  ssl_options {
    verify = verify_none
    keyfile = "/opt/emqx/etc/certs/key.pem"
    certfile = "/opt/emqx/etc/certs/cert.pem"
    cacertfile = "/opt/emqx/etc/certs/cacert.pem"
  }
}

# Anonymous / extra listener — start_port+3 = 18886
listeners.quic.annon {
  enabled = true
  bind = "18886"
  max_connections = infinity
  peer_bidi_stream_count = 1024
  ssl_options {
    verify = verify_none
    keyfile = "/opt/emqx/etc/certs/key.pem"
    certfile = "/opt/emqx/etc/certs/cert.pem"
    cacertfile = "/opt/emqx/etc/certs/cacert.pem"
  }
}

# nocert_mutual_auth_connection (test2b / test2c on start_port+4 = 18887)
# Server presents the trusted test cert, but verifies clients against a
# different CA so a valid client cert is rejected ("server does not have
# client cert"). test2c also uses this URI and fails because it omits
# trustStore. Do not point cacertfile at cacert.pem or test2b succeeds.
listeners.quic.mtls_nocert {
  enabled = true
  bind = "18887"
  max_connections = infinity
  peer_bidi_stream_count = 1024
  ssl_options {
    verify = verify_peer
    keyfile = "/opt/emqx/etc/certs/key.pem"
    certfile = "/opt/emqx/etc/certs/cert.pem"
    cacertfile = "/opt/emqx/etc/certs/untrusted-cacert.pem"
  }
}

# Required for test9000-7 (default 5 MB payload)
mqtt.max_packet_size = 100MB
force_shutdown.enable = false
